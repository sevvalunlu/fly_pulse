<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlyPulse | Canlı Uçuş Takibi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
    {% load static %}
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body class="bg-slate-950 text-slate-200 min-h-screen flex flex-col items-center justify-center relative overflow-hidden">

    <nav class="absolute top-0 left-0 w-full px-8 py-6 flex items-center justify-between z-50">
        <div class="flex items-center gap-10">
            <a href="{% url 'home' %}" class="text-2xl font-bold tracking-tight text-white hover:opacity-80 transition-opacity">
                Fly<span class="text-cyan-400">Pulse</span>
            </a>
            
            <div class="hidden md:flex items-center gap-6 text-sm font-medium text-slate-300">
                <a href="{% url 'map' %}" class="flex items-center gap-2 hover:text-cyan-400 transition-colors group">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-cyan-600 group-hover:text-cyan-400 transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7" />
                    </svg>
                    Canlı Radar
                </a>
            </div>
        </div>
    </nav>

    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[800px] h-[800px] bg-cyan-900/20 rounded-full blur-[120px] pointer-events-none"></div>

    <main class="z-10 flex flex-col items-center w-full max-w-4xl px-6">
        <div class="mb-10 text-center">
            <h1 class="text-6xl font-bold tracking-tight text-white mb-2">
                Fly<span class="text-cyan-400 neon-glow">Pulse</span>
            </h1>
            <p class="text-slate-400 text-lg tracking-wide">Gerçek Zamanlı Uçuş Radarı</p>
        </div>

        <form action="{% url 'map' %}" method="GET" class="w-full max-w-2xl relative search-glow rounded-full transition-shadow duration-300 mb-12">
            <input type="text" name="flight_id" placeholder="Uçuş Kodu Ara (Örn: TK1903)" 
                   class="w-full bg-slate-900/80 border border-slate-700/50 backdrop-blur-md text-white rounded-full py-4 pl-6 pr-32 text-lg focus:outline-none focus:border-cyan-500 transition-colors placeholder-slate-500">
            <button type="submit" class="absolute right-2 top-2 bottom-2 bg-cyan-600 hover:bg-cyan-500 text-white px-6 rounded-full font-medium transition-colors">
                Takip Et
            </button>
        </form>

        <div class="w-full">
            <h3 class="text-sm font-medium text-slate-400 tracking-widest uppercase mb-4 text-center">Şu Anda Havada Olanlar</h3>

            <div id="active-flights-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 w-full">
                <p class="text-slate-500 col-span-full text-center animate-pulse">Uçuş verileri aranıyor...</p>
            </div>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const response = await fetch('/api/flights/');
                const data = await response.json();
                
                if(data && data.states) {
                    const validFlights = data.states.filter(f => f[1] && f[1].trim() !== '' && f[2]);

                    const shuffled = validFlights.sort(() => 0.5 - Math.random());
                    const selected = shuffled.slice(0, 4);

                    const container = document.getElementById('active-flights-container');
                    container.innerHTML = ''; 

                    selected.forEach(flight => {
                        const callsign = flight[1].trim();
                        const country = flight[2];
                        
                        const cardHTML = `
                            <a href="/map/?flight_id=${callsign}" class="bg-slate-900/60 backdrop-blur-md border border-slate-800 hover:border-cyan-500/50 p-5 rounded-2xl transition-all duration-300 hover:-translate-y-1 shadow-lg group block cursor-pointer">
                                <div class="flex justify-between items-center mb-3">
                                    <span class="text-xl font-bold text-white group-hover:text-cyan-400 transition-colors">${callsign}</span>
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-cyan-600 group-hover:text-cyan-400 transition-colors transform group-hover:rotate-45" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
                                    </svg>
                                </div>
                                <p class="text-[10px] text-slate-500 uppercase tracking-widest mb-1">Kalkış Ülkesi</p>
                                <p class="text-sm font-medium text-slate-300 truncate">${country}</p>
                            </a>
                        `;
                        container.innerHTML += cardHTML;
                    });
                }
            } catch(e) {
                console.error("Ana sayfa verisi çekilemedi", e);
                document.getElementById('active-flights-container').innerHTML = '<p class="text-red-500 col-span-full text-center">Bağlantı hatası.</p>';
            }
        });
    </script>
</body>
</html>
